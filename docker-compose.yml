services:

  nginx:
    image: nginx:alpine
    container_name: proxy_nginx
    ports:
      - "8181:80"
    volumes:
      - ./front:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - security-api
      - cine-api
    networks:
      - app-network

  security-api:
    build: ./security-backend
    container_name: security_api
    environment:
      DATABASE_URL: ${SECURITY_DATABASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  cine-api:
    build: ./cine-backend
    container_name: cine_api
    environment:
      DATABASE_URL: ${CINE_DATABASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  mysql:
    image: mysql:8.4
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
